<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Académico ULEAM - Login Dark Premium</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0b0d12;
      --card-bg: rgba(18, 22, 31, 0.75);
      --input-bg: rgba(27, 33, 46, 0.6);
      --red-uleam: #e30613;
      --red-uleam-glow: rgba(227, 6, 19, 0.4);
      --red-uleam-dark: #9e020b;
      --text-white: #f1f5f9;
      --text-muted: #94a3b8;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-input: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Fondo oscuro con textura geométrica/arquitectónica e iluminación roja */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(227, 6, 19, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(0, 51, 102, 0.25), transparent 40%),
        linear-gradient(rgba(11, 13, 18, 0.88), rgba(11, 13, 18, 0.95)),
        url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&q=80&w=1600');
      background-size: cover;
      background-position: center;
      color: var(--text-white);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: 28px;
      padding: 45px 35px 35px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(227, 6, 19, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Logo 3D Flotante */
    .brand-logo-container {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-3d {
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #1f2533, #0f121a);
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(227, 6, 19, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2),
                  0 0 20px var(--red-uleam-glow);
      position: relative;
    }

    .logo-3d span {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 30%, var(--red-uleam));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 30px;
      text-align: center;
    }

    form {
      width: 100%;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    .input-box i.icon-left {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .input-box input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      background: var(--input-bg);
      border: 1px solid var(--border-input);
      border-radius: 16px;
      color: var(--text-white);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-box input::placeholder {
      color: #64748b;
    }

    .input-box input:focus {
      border-color: var(--red-uleam);
      box-shadow: 0 0 15px var(--red-uleam-glow);
      background: rgba(30, 38, 54, 0.8);
    }

    .input-box input:focus ~ i.icon-left {
      color: var(--red-uleam);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      accent-color: var(--red-uleam);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-pass {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .forgot-pass:hover {
      color: var(--red-uleam);
    }

    /* Botón Premium Red Gradient */
    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--red-uleam), var(--red-uleam-dark));
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(227, 6, 19, 0.3);
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(227, 6, 19, 0.45);
      background: linear-gradient(135deg, #ff1a27, var(--red-uleam));
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 25px 0;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span {
      padding: 0 15px;
    }

    .roles-quick {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.05);
    }

    .footer-text {
      margin-top: 25px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .footer-text a {
      color: var(--red-uleam);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Escudo / Emblem 3D Style ULEAM -->
    <div class="brand-logo-container">
      <div class="logo-3d">
        <span>U</span>
      </div>
    </div>

    <h1 class="title">Portal ULEAM</h1>
    <p class="subtitle">Ingresa tus credenciales para acceder a la gestión académica</p>

    <form onsubmit="event.preventDefault(); alert('Conectando con Backend en Python...');">
      <div class="input-box">
        <i class="fa-solid fa-id-card icon-left"></i>
        <input type="text" placeholder="Cédula / Usuario institucional" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon-left"></i>
        <input type="password" placeholder="Contraseña" required>
      </div>

      <div class="options">
        <label class="remember-me">
          <input type="checkbox"> Recordarme
        </label>
        <a href="#" class="forgot-pass">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" class="btn-login">
        <span>Iniciar Sesión</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="divider">
      <span>Accesos Rápido POO</span>
    </div>

    <!-- Opciones de acceso según las clases Python que creaste -->
    <div class="roles-quick">
      <div class="role-btn">
        <i class="fa-solid fa-user-graduate"></i> Estudiante
      </div>
      <div class="role-btn">
        <i class="fa-solid fa-chalkboard-user"></i> Docente
      </div>
      <div class="role-btn">
        <i class="fa-solid fa-user-gear"></i> Gestión
      </div>
    </div>

    <p class="footer-text">
      ¿Problemas de acceso? <a href="#">Soporte Técnico</a>
    </p>
  </div>

</body>
</html>
