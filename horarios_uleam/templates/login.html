<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Horarios ULEAM</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body class="pagina-login">
  <main class="login-tarjeta">
    <h1>Iniciar sesión</h1>
    {% if error %}<div class="alerta-login" role="alert">{{ error }}</div>{% endif %}
    <form id="formLogin" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <div class="campo-login">
        <input type="text" name="usuario" placeholder="Correo institucional" autocomplete="username" autocapitalize="none"
               spellcheck="false" value="{{ usuario_valor }}" required {{ 'autofocus' if not usuario_valor }} aria-label="Correo institucional">
      </div>
      <div class="campo-login">
        <input type="password" name="clave" id="clave" placeholder="Contraseña" autocomplete="current-password"
               required {{ 'autofocus' if usuario_valor }} aria-label="Contraseña" style="padding-right:78px">
        <button type="button" class="ver-clave" id="verClave" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
      <div class="opciones-login">
        <label><input type="checkbox" name="recordar"> Recordarme</label>
        <a href="#" id="abrirAyuda">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
    <p class="pie-login">Horarios · ULEAM</p>
  </main>

  <div class="modal-vidrio" id="modalAyuda" hidden>
    <div class="caja" role="dialog" aria-modal="true" aria-labelledby="tituloAyuda">
      <h2 id="tituloAyuda">Recuperar la contraseña</h2>
      <p>Las cuentas se administran en el programa de ingreso de datos. Pide a Gestión Académica que restablezca tu contraseña.</p>
      <div class="acciones-login"><button type="button" class="btn-login" data-cerrar>Entendido</button></div>
    </div>
  </div>
  <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
