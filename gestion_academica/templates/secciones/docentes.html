<h1>Docentes</h1>
<section class="tarjeta">
  <h2>Registrar docente</h2>
  <div class="fila">
    <div><label for="do-ced">Cédula</label><input id="do-ced" maxlength="10" inputmode="numeric"></div>
    <div><label for="do-nom">Nombre</label><input id="do-nom"></div>
    <div><label for="do-ape">Apellido</label><input id="do-ape"></div>
  </div>
  <div class="fila">
    <div><label for="do-esp">Especialidad</label><input id="do-esp"></div>
    <div><label for="do-asig">Asignatura</label><input id="do-asig"></div>
    <div><label for="do-niv">Nivel</label><input id="do-niv" type="number" min="1" max="10"></div>
    <button id="do-agregar" class="btn primario">Registrar</button>
  </div>
</section>
<section class="tarjeta">
  <label for="do-buscar">Buscar</label>
  <input id="do-buscar" placeholder="Nombre, apellido o cédula…">
  <div class="scroll"><table class="tabla">
    <thead><tr><th>Cédula</th><th>Docente</th><th>Especialidad</th><th>Asignatura</th><th>Nivel</th><th>Estado</th><th></th></tr></thead>
    <tbody id="do-tabla"></tbody></table></div>
</section>
