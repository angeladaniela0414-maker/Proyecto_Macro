<h1>Estudiantes</h1>
<section class="tarjeta">
  <h2>Registrar estudiante</h2>
  <div class="fila">
    <div><label for="es-ced">Cédula</label><input id="es-ced" maxlength="10" inputmode="numeric"></div>
    <div><label for="es-cod">Código de registro</label><input id="es-cod" type="number" min="1"></div>
    <div><label for="es-nom">Nombre</label><input id="es-nom"></div>
    <div><label for="es-ape">Apellido</label><input id="es-ape"></div>
  </div>
  <div class="fila">
    <div><label for="es-car">Carrera</label><input id="es-car" value="Software"></div>
    <div><label for="es-niv">Nivel</label><input id="es-niv" type="number" min="1" max="10"></div>
    <div><label for="es-cur">Paralelo</label><input id="es-cur" maxlength="3" placeholder="A"></div>
    <div><label for="es-asig">Asignatura</label><input id="es-asig"></div>
    <button id="es-agregar" class="btn primario">Registrar</button>
  </div>
  <p class="sub">El correo institucional se genera automáticamente.</p>
</section>
<section class="tarjeta">
  <div class="fila">
    <div><label for="es-buscar">Buscar</label><input id="es-buscar" placeholder="Nombre, apellido, cédula o código…"></div>
    <div><label for="es-filtro-niv">Nivel</label>
      <select id="es-filtro-niv"><option value="">Todos</option>{% for n in range(1, 11) %}<option>{{ n }}</option>{% endfor %}</select></div>
  </div>
  <div class="scroll"><table class="tabla">
    <thead><tr><th>Código</th><th>Cédula</th><th>Estudiante</th><th>Correo institucional</th><th>Carrera</th><th>Nivel</th><th>Par.</th><th></th></tr></thead>
    <tbody id="es-tabla"></tbody></table></div>
</section>
