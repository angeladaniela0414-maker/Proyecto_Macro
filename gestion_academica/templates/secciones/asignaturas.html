<h1>Asignaturas</h1>
<section class="tarjeta">
  <div class="fila">
    <div><label for="as-cod">Código</label><input id="as-cod" type="number"></div>
    <div><label for="as-nom">Nombre</label><input id="as-nom"></div>
    <div><label for="as-niv">Nivel</label><input id="as-niv" type="number" min="1" max="10"></div>
    <div><label for="as-car">Carrera</label><input id="as-car" value="Software"></div>
    <div><label for="as-hor">Horas/semana</label><input id="as-hor" type="number" min="2" value="4"></div>
    <button id="as-agregar" class="btn primario">Agregar</button>
  </div>
</section>
<section class="tarjeta scroll">
  <table class="tabla"><thead><tr><th>Código</th><th>Asignatura</th><th>Nivel</th><th>Carrera</th><th>Horas</th><th>Docente</th></tr></thead>
  <tbody id="as-tabla"></tbody></table>
</section>
