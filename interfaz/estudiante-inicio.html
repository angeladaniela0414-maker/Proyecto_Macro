<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · ULEAM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/horario.css">
  <link rel="stylesheet" href="css/impresion.css" media="print">
</head>
<body data-rol="estudiante">
<div class="app">
  <aside class="lateral">
    <div>
      <div class="marca"><div class="marca-logo">U</div><div><h3>ULEAM</h3><p>Portal estudiantil</p></div></div>
      <nav aria-label="Menú principal">
        <ul class="menu">
          <li><a href="estudiante-inicio.html" class="menu-enlace activo"><i class="fa-solid fa-house"></i> Inicio</a></li>
          <li><a href="estudiante-horario.html" class="menu-enlace"><i class="fa-solid fa-calendar-days"></i> Mi horario</a></li>
          <li><a href="estudiante-consulta.html" class="menu-enlace"><i class="fa-solid fa-table-cells"></i> Consultar horarios</a></li>
          <li><a href="estudiante-salones.html" class="menu-enlace"><i class="fa-solid fa-door-open"></i> Salones</a></li>
        </ul>
      </nav>
    </div>
    <div class="lateral-pie">
      <button type="button" class="menu-enlace" data-salir><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
      <small>Sistema de horarios ULEAM</small>
    </div>
  </aside>
  <div class="velo" id="velo"></div>
  <div class="principal">
    <header class="topbar">
      <button class="btn-menu" id="btnMenu" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
      <div class="buscador"><i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="buscador" placeholder="Filtrar en esta página…" aria-label="Filtrar en esta página"></div>
      <div class="perfil-chip">
        <span class="avatar" data-usuario-inicial>U</span>
        <div><strong data-usuario-nombre>Usuario</strong><small>Portal estudiantil</small></div>
      </div>
    </header>
    <main class="contenido">
      <div id="mensajes"></div>
      <section class="banner">
        <div><h2>¡Hola, <span data-usuario-nombre-corto>…</span>!</h2><p>Período académico 2026-1</p></div>
        <a class="chip-banner" href="estudiante-horario.html">Ver mi horario</a>
      </section>
      <section class="kpis"><div class="kpi"><div class="kpi-icono "><i class="fa-solid fa-book-open"></i></div><div><strong data-kpi="asignaturas">0</strong><span>Asignaturas</span></div></div><div class="kpi"><div class="kpi-icono ambar"><i class="fa-solid fa-clock"></i></div><div><strong data-kpi="horas">0</strong><span>Horas semanales</span></div></div><div class="kpi"><div class="kpi-icono verde"><i class="fa-solid fa-calendar-day"></i></div><div><strong data-kpi="hoy">0</strong><span>Clases hoy</span></div></div></section>
      <div class="dos-columnas">
        <div class="tarjeta">
          <h3 class="tarjeta-titulo"><span><i class="fa-solid fa-graduation-cap"></i> Mis asignaturas</span><a href="estudiante-horario.html">Ver horario</a></h3>
          <div id="listaAsignaturas"></div>
        </div>
        <div class="tarjeta">
          <h3 class="tarjeta-titulo"><span><i class="fa-solid fa-calendar-day"></i> Clases de hoy</span></h3>
          <div id="clasesHoy"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/datos.js"></script>
<script src="js/sesion.js"></script>
<script src="js/app.js"></script>
<script src="js/horarios.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
