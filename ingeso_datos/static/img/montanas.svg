<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa8a5"/><stop offset=".45" stop-color="#5f706f"/><stop offset="1" stop-color="#2b3b3d"/>
    </linearGradient>
    <linearGradient id="lejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8083"/><stop offset="1" stop-color="#4a5d60"/>
    </linearGradient>
    <linearGradient id="medio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5254"/><stop offset="1" stop-color="#26373a"/>
    </linearGradient>
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9d8" stop-opacity="0"/><stop offset=".6" stop-color="#cfd9d8" stop-opacity=".28"/><stop offset="1" stop-color="#cfd9d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8f91"/><stop offset="1" stop-color="#3a4a4c"/>
    </linearGradient>
    <symbol id="pino" viewBox="0 0 100 300">
      <polygon points="50,0 78,95 22,95"/><polygon points="50,55 88,170 12,170"/>
      <polygon points="50,120 97,250 3,250"/><rect x="45" y="245" width="10" height="55"/>
    </symbol>
  </defs>
  <rect width="1600" height="900" fill="url(#cielo)"/>
  <!-- cordillera lejana -->
  <polygon fill="url(#lejos)" points="0,420 120,330 230,380 380,200 470,290 560,170 700,330 820,250 940,360 1060,210 1180,330 1300,260 1420,350 1520,290 1600,330 1600,640 0,640"/>
  <g fill="#e9eeee" opacity=".92">
    <polygon points="380,200 330,285 372,272 400,300 430,262 470,290"/>
    <polygon points="560,170 505,262 548,250 575,282 610,240 640,270 700,330 640,262"/>
    <polygon points="1060,210 1005,300 1048,288 1075,318 1112,276 1150,300 1180,330 1128,262"/>
    <polygon points="820,250 780,308 815,300 840,322 868,290 900,310 940,360 880,282"/>
  </g>
  <rect y="300" width="1600" height="260" fill="url(#niebla)"/>
  <!-- montañas medias -->
  <polygon fill="url(#medio)" points="0,560 140,470 260,520 420,400 560,520 700,450 860,560 1000,470 1160,540 1320,430 1460,520 1600,470 1600,720 0,720"/>
  <rect y="480" width="1600" height="200" fill="url(#niebla)" opacity=".8"/>
  <!-- bosque lejano -->
  <g fill="#1d2e2d" opacity=".85">
    <use href="#pino" x="640" y="500" width="40" height="120"/><use href="#pino" x="690" y="520" width="34" height="100"/>
    <use href="#pino" x="740" y="505" width="42" height="125"/><use href="#pino" x="800" y="525" width="34" height="100"/>
    <use href="#pino" x="860" y="510" width="40" height="120"/><use href="#pino" x="920" y="530" width="32" height="96"/>
    <use href="#pino" x="980" y="515" width="40" height="120"/><use href="#pino" x="1040" y="535" width="34" height="100"/>
  </g>
  <rect y="600" width="1600" height="300" fill="#1f2f2e"/>
  <rect y="720" width="1600" height="60" fill="url(#agua)"/>
  <rect y="765" width="1600" height="135" fill="#14201f"/>
  <!-- pinos cercanos -->
  <g fill="#0d1817">
    <use href="#pino" x="-20" y="60" width="150" height="560"/><use href="#pino" x="90" y="260" width="120" height="440"/>
    <use href="#pino" x="190" y="380" width="100" height="360"/><use href="#pino" x="280" y="470" width="90" height="320"/>
    <use href="#pino" x="1380" y="340" width="110" height="400"/><use href="#pino" x="1470" y="170" width="150" height="560"/>
    <use href="#pino" x="1320" y="470" width="90" height="320"/><use href="#pino" x="1240" y="540" width="80" height="260"/>
  </g>
  <rect y="800" width="1600" height="100" fill="#0b1413"/>
</svg>
