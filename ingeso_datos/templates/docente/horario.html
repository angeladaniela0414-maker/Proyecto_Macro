{% extends "layout.html" %}
{% block titulo %}Mi horario{% endblock %}
{% block contenido %}
<div class="cabecera">
  <div><h1>Mi horario de clases</h1><p>Período {{ periodo.nombre if periodo else '—' }}</p></div>
  <div class="acciones"><button class="btn btn-primario" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> Descargar PDF</button></div>
</div>
<div class="tarjeta">
  <div class="solo-impresion"><h1>Horario docente · ULEAM</h1><p>{{ usuario_nombre }}</p></div>
  <div class="horario-app" id="horarioApp" data-api="{{ url_for('comun.api_horario') }}" data-fijos='{"alcance":"mio"}' data-grupo="1"></div>
</div>
{% endblock %}
