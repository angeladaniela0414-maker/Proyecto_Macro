<h1>Laboratorios</h1>
<section class="tarjeta">
  <h2>Registrar laboratorio</h2>
  <div class="fila">
    <div><label for="la-numero">Número de laboratorio</label><input id="la-numero" type="number" min="1"></div>
    <div><label for="la-cap">Capacidad</label><input id="la-cap" type="number" min="1"></div>
    <button id="la-agregar" class="btn primario">Registrar laboratorio</button>
  </div>
</section>
<section class="tarjeta scroll">
  <table class="tabla"><thead><tr><th>Número</th><th>Capacidad</th><th>Estado</th><th>Acciones</th></tr></thead>
  <tbody id="la-tabla"></tbody></table>
</section>
