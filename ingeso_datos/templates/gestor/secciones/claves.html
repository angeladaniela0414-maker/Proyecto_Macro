<h1>Claves de acceso</h1>
<section class="tarjeta">
  <h2>Restablecer una clave</h2>
  <p class="sub">Genera una clave temporal para cualquier usuario (estudiante, docente o gestión). Se muestra una sola vez.</p>
  <div class="fila">
    <div><label for="cl-correo">Correo institucional</label><input id="cl-correo" type="email" placeholder="usuario@live.uleam.edu.ec"></div>
    <button id="cl-restablecer" class="btn primario">Generar clave temporal</button>
  </div>
  <div id="cl-resultado"></div>
</section>
<section class="tarjeta scroll">
  <h2>Solicitudes desde la pantalla de ingreso</h2>
  <table class="tabla"><thead><tr><th>Correo</th><th>Fecha</th><th>Estado</th><th></th></tr></thead>
  <tbody id="cl-tabla"></tbody></table>
</section>
