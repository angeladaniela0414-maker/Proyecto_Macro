<h1>Generación de horarios</h1>
<section class="tarjeta">
  <div class="fila">
    <div><label for="gh-nivel">Nivel</label>
      <select id="gh-nivel">{% for n in range(1, 9) %}<option value="{{ n }}" {{ 'selected' if n == 4 }}>{{ n }}</option>{% endfor %}</select></div>
    <div><label for="gh-periodo">Periodo</label><input id="gh-periodo" value="{{ periodo or '2026-1' }}"></div>
    <div><label for="gh-paralelo">Paralelo</label><input id="gh-paralelo" value="A" maxlength="3"></div>
    <button id="gh-generar" class="btn primario">⚙ Generar automáticamente</button>
    <button id="gh-limpiar" class="btn peligro">Limpiar nivel</button>
  </div>
  <ul id="gh-avisos" class="avisos"></ul>
</section>

<section class="tarjeta">
  <h2>Agregar bloque manualmente</h2>
  <div class="fila">
    <div><label for="gh-asig">Asignatura</label><select id="gh-asig"></select></div>
    <div><label for="gh-salon">Salón</label><select id="gh-salon"></select></div>
    <div><label for="gh-dia">Día</label>
      <select id="gh-dia">{% for d in dias %}<option>{{ d }}</option>{% endfor %}</select></div>
    <div><label for="gh-ini">Inicio</label><input id="gh-ini" type="number" min="7" max="20" value="8"></div>
    <div><label for="gh-fin">Fin</label><input id="gh-fin" type="number" min="8" max="21" value="10"></div>
    <button id="gh-agregar" class="btn">Agregar</button>
  </div>
</section>

<section class="tarjeta">
  <h2>Horario semanal</h2>
  <div class="scroll"><table id="gh-grilla" class="grilla"></table></div>
</section>
