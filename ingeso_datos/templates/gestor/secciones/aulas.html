<h1>Aulas</h1>
<section class="tarjeta">
  <h2>Registrar aula</h2>
  <div class="fila">
    <div><label for="au-numero">Número de aula</label><input id="au-numero" type="number" min="1"></div>
    <div><label for="au-cap">Capacidad</label><input id="au-cap" type="number" min="1"></div>
    <button id="au-agregar" class="btn primario">Registrar aula</button>
  </div>
</section>
<section class="tarjeta scroll">
  <table class="tabla"><thead><tr><th>Número</th><th>Capacidad</th><th>Estado</th><th>Acciones</th></tr></thead>
  <tbody id="au-tabla"></tbody></table>
</section>
